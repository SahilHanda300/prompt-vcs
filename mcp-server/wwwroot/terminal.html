<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PromptVCS Terminal</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xterm/6.0.0/xterm.min.css">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #1e1e1e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #gate {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 14px;
  }
  #gate h1 {
    color: #eee;
    font-size: 1.15rem;
    font-weight: 500;
    margin: 0 0 4px;
  }
  #gate input {
    padding: 10px 12px;
    width: 260px;
    border-radius: 6px;
    border: 1px solid #444;
    background: #2a2a2a;
    color: #eee;
    font-size: 0.95rem;
  }
  #gate .password-field {
    position: relative;
    width: 260px;
  }
  #gate .password-field input {
    width: 100%;
    box-sizing: border-box;
    padding-right: 38px;
  }
  #gate .toggle-password {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    color: #888;
    cursor: pointer;
    border-radius: 4px;
  }
  #gate .toggle-password:hover { color: #ccc; background: #3a3a3a; }
  #gate .toggle-password svg { width: 18px; height: 18px; display: block; }
  #gate .password-hint {
    width: 260px;
    box-sizing: border-box;
    font-size: 0.75rem;
    color: #888;
    text-align: left;
    margin-top: -6px;
  }
  #gate .password-hint.valid { color: #6c6; }
  #gate .buttons {
    display: flex;
    gap: 10px;
  }
  #gate button {
    padding: 10px 18px;
    border-radius: 6px;
    border: none;
    font-size: 0.95rem;
    cursor: pointer;
  }
  #gate button:disabled { opacity: 0.6; cursor: default; }
  #gate #loginBtn { background: #4f8ef7; color: white; }
  #gate #loginBtn:hover:not(:disabled) { background: #3f7fe0; }
  #gate #registerBtn { background: #333; color: #eee; border: 1px solid #555; }
  #gate #registerBtn:hover:not(:disabled) { background: #3d3d3d; }
  #gate .message { font-size: 0.85rem; min-height: 1.2em; }
  #gate .message.error { color: #f77; }
  #gate .message.info { color: #9ad; }
  #terminal-wrap {
    display: none;
    height: 100%;
    box-sizing: border-box;
    padding: 8px;
  }
  #terminal { height: 100%; }
</style>
</head>
<body>

<div id="gate">
  <h1>PromptVCS</h1>
  <input id="username" type="text" placeholder="Username" autocomplete="username">
  <div class="password-field">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password" title="Show password"></button>
  </div>
  <div class="password-hint" id="passwordHint">Min. 8 characters (required to create an account)</div>
  <div class="buttons">
    <button id="loginBtn">Log in</button>
    <button id="registerBtn">Create account</button>
  </div>
  <div class="message" id="message"></div>
</div>

<div id="terminal-wrap">
  <div id="terminal"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/6.0.0/xterm.js"></script>
<script>
(function () {
  const gate = document.getElementById('gate');
  const wrap = document.getElementById('terminal-wrap');
  const usernameInput = document.getElementById('username');
  const passwordInput = document.getElementById('password');
  const togglePasswordBtn = document.getElementById('togglePassword');
  const passwordHint = document.getElementById('passwordHint');
  const loginBtn = document.getElementById('loginBtn');
  const registerBtn = document.getElementById('registerBtn');
  const messageEl = document.getElementById('message');

  const MIN_PASSWORD_LENGTH = 8;

  const EYE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_OFF_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  togglePasswordBtn.innerHTML = EYE_ICON;

  togglePasswordBtn.addEventListener('click', () => {
    const showing = passwordInput.type === 'text';
    passwordInput.type = showing ? 'password' : 'text';
    togglePasswordBtn.innerHTML = showing ? EYE_ICON : EYE_OFF_ICON;
    togglePasswordBtn.title = showing ? 'Show password' : 'Hide password';
    togglePasswordBtn.setAttribute('aria-label', togglePasswordBtn.title);
    passwordInput.focus();
  });

  passwordInput.addEventListener('input', () => {
    passwordHint.classList.toggle('valid', passwordInput.value.length >= MIN_PASSWORD_LENGTH);
  });

  let ws = null;
  let term = null;
  let authPending = false;
  let authBuffer = '';
  let authTimer = null;

  function setMessage(text, kind) {
    messageEl.textContent = text || '';
    messageEl.className = 'message' + (kind ? ' ' + kind : '');
  }

  function setBusy(busy) {
    loginBtn.disabled = busy;
    registerBtn.disabled = busy;
    usernameInput.disabled = busy;
    passwordInput.disabled = busy;
  }

  // Used both for "logout" (the CLI process stays alive, ws stays open —
  // the next login/register reuses it) and for the connection actually
  // ending ("exit"/"quit", idle timeout, network drop — ws is gone, the
  // next login/register spawns a fresh process via connectAndAuth).
  function backToGate(message) {
    wrap.style.display = 'none';
    gate.style.display = 'flex';
    passwordInput.value = '';
    setBusy(false);
    setMessage(message, 'info');
    usernameInput.focus();
  }

  // A username/password can contain spaces — quote both so the CLI's
  // argument tokenizer (which supports "quoted spans") treats each as one
  // argument regardless. Embedded quotes aren't supported by that
  // tokenizer either way, so this covers the same cases the CLI itself does.
  function quote(value) {
    return '"' + value.replace(/"/g, '') + '"';
  }

  function submit(command) {
    const username = usernameInput.value.trim();
    const password = passwordInput.value;
    if (!username || !password) {
      setMessage('Enter a username and password.', 'error');
      return;
    }
    // Only enforced when creating an account — an existing account's
    // password is whatever it already is, so login must never be blocked
    // by a rule introduced after that account was created.
    if (command === 'register' && password.length < MIN_PASSWORD_LENGTH) {
      setMessage(`Password must be at least ${MIN_PASSWORD_LENGTH} characters.`, 'error');
      return;
    }

    setBusy(true);
    setMessage(command === 'login' ? 'Logging in…' : 'Creating account…', 'info');

    if (ws && ws.readyState === WebSocket.OPEN) {
      sendAuthCommand(command, username, password);
    } else {
      connectAndAuth(command, username, password);
    }
  }

  function connectAndAuth(command, username, password) {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/terminal-ws`);
    authBuffer = '';

    ws.onopen = () => {
      // Wait for the spawned CLI's first output (its welcome banner) before
      // sending anything — that's proof the process is alive and blocked on
      // reading its next line, not proof of ordering that Windows/dotnet
      // startup timing could otherwise violate.
      ws.addEventListener('message', function onFirstOutput() {
        ws.removeEventListener('message', onFirstOutput);
        sendAuthCommand(command, username, password);
      }, { once: true });
    };
    ws.onerror = () => {
      setBusy(false);
      setMessage('Could not connect to the server.', 'error');
    };
    ws.onclose = () => {
      if (wrap.style.display === 'none') {
        setBusy(false);
        setMessage('Connection closed before authentication finished.', 'error');
      }
    };
  }

  function sendAuthCommand(command, username, password) {
    authPending = true;
    authBuffer = '';
    ws.send(`${command} ${quote(username)} ${quote(password)}`);

    ws.addEventListener('message', onAuthMessage);
    authTimer = setTimeout(() => {
      if (!authPending) return;
      finishAuth(false, 'Request timed out. Try again.');
    }, 20000);
  }

  function onAuthMessage(event) {
    if (!authPending) return;
    authBuffer += event.data;

    if (authBuffer.includes('Logged in as')) {
      finishAuth(true);
    } else if (authBuffer.includes('Error:')) {
      const match = authBuffer.match(/Error: ([^\r\n]*)/);
      const raw = match ? match[1] : 'Authentication failed.';
      finishAuth(false, raw.replace(/\x1b\[[0-9;]*m/g, ''));
    }
  }

  function finishAuth(success, errorText) {
    authPending = false;
    clearTimeout(authTimer);
    ws.removeEventListener('message', onAuthMessage);

    if (!success) {
      setBusy(false);
      setMessage(errorText, 'error');
      return;
    }

    gate.style.display = 'none';
    wrap.style.display = 'block';
    startTerminal(ws, authBuffer);
  }

  loginBtn.addEventListener('click', () => submit('login'));
  registerBtn.addEventListener('click', () => submit('register'));
  passwordInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit('login'); });

  function startTerminal(socket, replayText) {
    var BACKSPACE = String.fromCharCode(127);
    var CTRL_C = String.fromCharCode(3);

    if (term) term.dispose(); // re-entering after a "logout" round-trip
    term = new Terminal({
      cursorBlink: true,
      fontSize: 14,
      theme: { background: '#1e1e1e' },
    });
    term.open(document.getElementById('terminal'));
    term.write(replayText);
    term.focus();

    let lineBuffer = '';
    let recentOutput = '';

    socket.onmessage = (event) => {
      term.write(event.data);
      // "logout" doesn't end the CLI process or the connection — it just
      // drops back to an unauthenticated prompt — so this is the only way
      // to notice it happened and send the user back to the gate. Match
      // against a small rolling buffer, not just this one message, in case
      // the marker text lands split across two WebSocket frames; match the
      // exact ANSI-green-coded line the CLI actually prints, not a bare
      // substring that could in principle appear in unrelated output.
      recentOutput = (recentOutput + event.data).slice(-200);
      if (recentOutput.includes('\x1b[32mLogged out.')) {
        backToGate('Logged out.');
      }
    };
    socket.onclose = () => {
      // "exit"/"quit" (process exits), the idle timeout, or a dropped
      // connection all land here — the CLI process is gone either way, so
      // the next login/register needs a fresh one via connectAndAuth.
      ws = null;
      backToGate('Session ended. Log in again.');
    };

    term.onData((data) => {
      for (const ch of data) {
        if (ch === '\r') {
          term.write('\r\n');
          if (socket.readyState === WebSocket.OPEN) socket.send(lineBuffer);
          lineBuffer = '';
        } else if (ch === BACKSPACE) {
          if (lineBuffer.length > 0) {
            lineBuffer = lineBuffer.slice(0, -1);
            term.write('\b \b');
          }
        } else if (ch === CTRL_C) {
          // No local shell to interrupt — ignore.
        } else {
          lineBuffer += ch;
          term.write(ch);
        }
      }
    });
  }
})();
</script>
</body>
</html>
